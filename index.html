<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNVO - قريبًا الافتتاح</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  font-family: Arial, sans-serif;
  color: #111;
  text-align: center;
}

.container {
  max-width: 600px;
  padding: 30px;
}

.logo {
  width: 180px;
  margin-bottom: 25px;
}

h1 {
  font-size: 38px;
  margin-bottom: 15px;
}

.description {
  font-size: 18px;
  line-height: 1.8;
  color: #555;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 30px;
}

.box {
  background: #111;
  color: white;
  padding: 15px;
  border-radius: 12px;
  min-width: 75px;
}

.number {
  font-size: 28px;
  font-weight: bold;
}

.label {
  font-size: 13px;
}

.open {
  margin-top: 25px;
  font-size: 20px;
  font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<img class="logo" src="https://aynvo.com/assets/images/image01.png" alt="AYNVO Logo">

<h1>قريبًا الافتتاح 🚀</h1>

<p class="description">
نعمل على إطلاق تجربة استثنائية. ترقبونا قريبًا
<br><br>
منتجات مطبوعة بتقنية الطباعة ثلاثية الأبعاد، بتصاميم فريدة وجودة استثنائية.
</p>

<div class="countdown">
<div class="box">
<div class="number" id="days">0</div>
<div class="label">يوم</div>
</div>

<div class="box">
<div class="number" id="hours">0</div>
<div class="label">ساعة</div>
</div>

<div class="box">
<div class="number" id="minutes">0</div>
<div class="label">دقيقة</div>
</div>

<div class="box">
<div class="number" id="seconds">0</div>
<div class="label">ثانية</div>
</div>
</div>

<div class="open" id="message"></div>

</div>


<script>

let launchDate = new Date("August 21, 2026 12:00:00").getTime();

let timer = setInterval(function(){

let now = new Date().getTime();
let distance = launchDate - now;

let days = Math.floor(distance / (1000 * 60 * 60 * 24));
let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
let seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

if(distance < 0){
clearInterval(timer);
document.getElementById("message").innerHTML = "تم الافتتاح 🎉";
}

},1000);

</script>

</body>
</html>
